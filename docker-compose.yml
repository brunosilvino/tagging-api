services:
  postgres:
    container_name: db-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tagging
      POSTGRES_USER: tagging
      POSTGRES_PASSWORD: tagging
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  pgadmin:
    container_name: db-pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tagging.dev
      PGADMIN_DEFAULT_PASSWORD: tagging
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    restart: unless-stopped

  tagging-api:
    container_name: api
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app
    environment:
      - DATABASE_URL=postgresql://tagging:tagging@postgres:5432/tagging
      
      # Flask
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=development
      - FLASK_APP=main.py
      
      # CORS (em dev: "*", em prod: "https://dominio1.com,https://dominio2.com")
      - CORS_ORIGINS=*
      - CORS_MAX_AGE=86400
      - API_KEY=local-development-key
      
      # Deduplication cache (tempo em segundos, max entries)
      - DEDUP_TTL=2.0
      
      # Security (deixe vazio em dev, configure em produção via GitHub Secrets)
      - ADMIN_KEY=

    depends_on:
      - postgres
    command: python -m flask run --host=0.0.0.0 --port=8080 --reload
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
