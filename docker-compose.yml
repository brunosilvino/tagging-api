#Versão da sintaxe do Docker Compose
version: '3.8' 

services:
  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  redisinsight:
    container_name: redisinsight
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    restart: unless-stopped

  tagging-api:
    container_name: tagging-api
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app
      - ./key.json:/secrets/key.json:ro
    environment:
      # Google Cloud
      - GOOGLE_CLOUD_PROJECT=tagging-api-481123
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/key.json
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PREFIX=tagging-api
      
      # Flask
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=development
      - FLASK_APP=main.py
      
      # CORS (em dev: "*", em prod: "https://dominio1.com,https://dominio2.com")
      - CORS_ORIGINS=*
      - CORS_MAX_AGE=86400
      
      # Deduplication cache (tempo em segundos, max entries)
      - DEDUP_TTL=2.0
      - DEDUP_MAXSIZE=1000
      
      # Security (deixe vazio em dev, configure em produção via GitHub Secrets)
      - ADMIN_KEY=
    depends_on:
      - redis
    command: python -m flask run --host=0.0.0.0 --port=8080 --reload
    restart: unless-stopped

volumes:
  redisinsight_data:
