services:
  - type: web
    name: tagging-api 
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tagging-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://taggingapi.onrender.com
      - key: API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: DEDUP_TTL
        value: "2.0"

  - type: static
    name: tagging-frontend
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    envVars:
      - key: API_URL
        value: https://taggingapi.onrender.com

databases:
  - name: tagging-db
    plan: starter